<svg viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nodes-g" x1="0" y1="0" x2="88" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00e5cc"/><stop offset="1" stop-color="#9b59ff"/>
    </linearGradient>
    <linearGradient id="text-g" x1="20" y1="24" x2="68" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00e5cc"/><stop offset="1" stop-color="#ff3eb5"/>
    </linearGradient>
  </defs>
  <!-- Connector lines -->
  <line x1="14" y1="44" x2="22" y2="44" stroke="url(#nodes-g)" stroke-width="1.8" opacity="0.55"/>
  <line x1="66" y1="44" x2="74" y2="44" stroke="url(#nodes-g)" stroke-width="1.8" opacity="0.55"/>
  <!-- Node 1: input circle -->
  <circle cx="8" cy="44" r="7" fill="#00e5cc" opacity="0.88"/>
  <!-- Node 2: transformer — large rect with US. inside -->
  <rect x="22" y="26" width="44" height="36" rx="6" stroke="url(#nodes-g)" stroke-width="2"/>
  <text x="44" y="44"
    font-family="Space Grotesk, system-ui, sans-serif"
    font-weight="700" font-size="18"
    fill="url(#text-g)"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="2">US.</text>
  <!-- Node 3: output arrow -->
  <polygon points="83,44 74,37 74,51" fill="#9b59ff" opacity="0.9"/>
