<svg viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nodes-g" x1="0" y1="0" x2="88" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00e5cc"/><stop offset="1" stop-color="#9b59ff"/>
    </linearGradient>
    <linearGradient id="text-g" x1="44" y1="44" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00e5cc"/><stop offset="1" stop-color="#ff3eb5"/>
    </linearGradient>
  </defs>
  <!-- Connector lines -->
  <line x1="20" y1="30" x2="34" y2="30" stroke="url(#nodes-g)" stroke-width="1.8" opacity="0.5"/>
  <line x1="52" y1="30" x2="63" y2="30" stroke="url(#nodes-g)" stroke-width="1.8" opacity="0.5"/>
  <!-- Node 1: Input circle -->
  <circle cx="14" cy="30" r="6.5" fill="#00e5cc" opacity="0.88"/>
  <!-- Node 2: Transform square -->
  <rect x="34" y="21" width="18" height="18" rx="4" stroke="url(#nodes-g)" stroke-width="2"/>
  <line x1="43" y1="21" x2="43" y2="39" stroke="url(#nodes-g)" stroke-width="1" opacity="0.3"/>
  <!-- Node 3: Output arrow -->
  <polygon points="75,30 63,23 63,37" fill="#9b59ff" opacity="0.9"/>
  <!-- US. below the arrow -->
  <text x="69" y="60"
    font-family="Space Grotesk, system-ui, sans-serif"
    font-weight="700" font-size="18"
    fill="url(#text-g)"
    text-anchor="middle"
    letter-spacing="2">US.</text>
  <!-- Accent underline -->
  <line x1="54" y1="67" x2="84" y2="67" stroke="url(#text-g)" stroke-width="1.5"/>
</svg>
