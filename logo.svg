<svg viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nodes-g" x1="0" y1="0" x2="88" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00e5cc"/><stop offset="1" stop-color="#9b59ff"/>
    </linearGradient>
    <linearGradient id="text-g" x1="0" y1="0" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00e5cc"/><stop offset="1" stop-color="#ff3eb5"/>
    </linearGradient>
  </defs>
  <!-- Connector lines -->
  <line x1="20" y1="28" x2="35" y2="28" stroke="url(#nodes-g)" stroke-width="1.5" opacity="0.5"/>
  <line x1="53" y1="28" x2="64" y2="28" stroke="url(#nodes-g)" stroke-width="1.5" opacity="0.5"/>
  <!-- Node 1 — Input circle -->
  <circle cx="14" cy="28" r="6" fill="#00e5cc" opacity="0.88"/>
  <!-- Node 2 — Transform square -->
  <rect x="35" y="20" width="18" height="16" rx="4" stroke="url(#nodes-g)" stroke-width="2"/>
  <line x1="44" y1="20" x2="44" y2="36" stroke="url(#nodes-g)" stroke-width="1" opacity="0.35"/>
  <!-- Node 3 — Output arrow -->
  <polygon points="74,28 64,22 64,34" fill="#9b59ff" opacity="0.9"/>
  <!-- US. text — teal to pink gradient -->
  <text x="44" y="65"
    font-family="Space Grotesk, system-ui, sans-serif"
    font-weight="700" font-size="22"
    fill="url(#text-g)"
    text-anchor="middle"
    letter-spacing="2">US.</text>
  <!-- Accent underline — teal to pink -->
  <line x1="16" y1="72" x2="72" y2="72" stroke="url(#text-g)" stroke-width="1.5"/>
</svg>
